<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <title>sleeping bag</title>
  <!-- Main outline of the sleeping bag -->
  <path d="M35,25 C35,15 40,10 50,10 C60,10 65,15 65,25 L65,85 C65,90 60,90 50,90 C40,90 35,90 35,85 Z" />
  <!-- Zipper line down the center/side -->
  <line x1="50" y1="28" x2="50" y2="90" stroke-dasharray="2,3" />
  <!-- Hood/Opening curve -->
  <path d="M35,28 C40,33 60,33 65,28" />
  <!-- Pillow outline inside head area -->
  <rect x="42" y="16" width="16" height="8" rx="2" fill="none" />
  <!-- Horizontal quilted lines to give it a realistic sleeping bag look -->
  <line x1="35" y1="42" x2="65" y2="42" />
  <line x1="35" y1="54" x2="65" y2="54" />
  <line x1="35" y1="66" x2="65" y2="66" />
  <line x1="35" y1="78" x2="65" y2="78" />
</svg>
