<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- JavaScript -->
  <script src="/js/product-listing.js" type="module"></script>
</head>

<body>
  <!-- HEADER -->
  <header id="main-header" class="divider"></header>

  <!-- MAIN -->
  <main class="divider">
    <!-- HERO -->
    <section class="hero">
      <!-- HERO IMAGE -->
      <img class="hero-img" src="/images/banner.jpg" srcset="
            /images/banner-sm.jpg  500w,
            /images/banner.jpg    1200w
          " alt="Mountain Lake Camping" />

      <!-- CENTER LOGO -->
      <div class="logo logo--square">
        <img src="/images/noun_Tent_2517.svg" alt="Sleep Outside Logo" />

        <div>Sleep<span class="highlight">Outside</span></div>
      </div>

      <!-- MISSION -->
      <div class="mission">
        <p>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </p>
      </div>
    </section>

    <!-- CATEGORIES -->
    <section class="categories">
      <h2>Shop by Category</h2>
      <ul>
        <li><a href="/product_listing/index.html?category=tents"><img src="public/images/category-tents.svg" alt="Tents" width="50" height="50">Tents</a></li>
        <li><a href="/product_listing/index.html?category=backpacks"><img src="public/images/category-backpacks.svg" alt="Backpacks" width="50" height="50">Backpacks</a></li>
        <li><a href="/product_listing/index.html?category=sleepingbags"><img src="public/images/category-sleepingbags.svg" alt="Sleeping Bags" width="50" height="50">Sleeping Bags</a></li>
        <li><a href="/product_listing/index.html?category=hammocks"><img src="public/images/category-hammocks.svg" alt="Hammocks" width="50" height="50">Hammocks</a></li>
      </ul>
    </section>

    <!-- PRODUCTS -->
    <section class="products">
      <h2>Top Products</h2>

      <!-- PRODUCTS FROM JSON -->
      <ul class="product-list"></ul>
    </section>
  </main>

  <!-- FOOTER -->
  <footer id="main-footer"></footer>
</body>

</html>
