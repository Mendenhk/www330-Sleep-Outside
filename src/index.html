<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- JavaScript -->
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <!-- HEADER -->
    <header id="main-header" class="divider"></header>

    <!-- MAIN -->
    <main class="divider">
      <!-- HERO -->
      <section class="hero">
        <!-- HERO IMAGE -->
        <img
          class="hero-img"
          src="public/images/banner.jpg"
          srcset="
            public/images/banner-sm.jpg  500w,
            public/images/banner.jpg    1200w
          "
          alt="Mountain Lake Camping"
        />

        <!-- CENTER LOGO -->
        <div class="logo logo--square">
          <img
            src="public/images/noun_Tent_2517.svg"
            alt="Sleep Outside Logo"
          />

          <div>Sleep<span class="highlight">Outside</span></div>
        </div>

        <!-- MISSION -->
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </section>

      <!-- PRODUCTS -->
      <section class="products">
        <h2>Top Products</h2>

        <!-- PRODUCTS FROM JSON -->
        <ul class="product-list"></ul>
      </section>
    </main>

    <!-- FOOTER -->
    <footer id="main-footer"></footer>
  </body>
</html>
