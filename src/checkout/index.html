<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products checkout">
        <h2>Review & Place your Order</h2>
        <form class="checkout-form" method="post">
          <div class="checkout-form__section">
            <p>Customer Name</p>
            <input
              type="text"
              name="first-name"
              id="first-name"
              placeholder="First Name"
              required
            />
            <input
              type="text"
              name="last-name"
              id="last-name"
              placeholder="Last Name"
              required
            />
          </div>
          <div class="checkout-form__section checkout-form__section--address">
            <p>Address</p>
            <input
              type="text"
              name="street-address"
              id="street-address"
              placeholder="Street Address"
              required
            />
            <input
              type="text"
              name="city"
              id="city"
              placeholder="City"
              required
            />
            <input
              type="text"
              name="state"
              id="state"
              placeholder="State"
              required
            />
            <input
              type="text"
              name="zip"
              id="zip"
              placeholder="Zip Code"
              inputmode="numeric"
              required
            />
          </div>
          <div class="checkout-form__section checkout-form__section--payment">
            <p>Payment Information</p>
            <input
              type="text"
              name="card-number"
              id="card-number"
              placeholder="Card Number"
              inputmode="numeric"
              pattern="[0-9\s-]{16,23}"
              title="Enter a 16-digit card number."
              required
            />
            <input
              type="text"
              name="expiration-date"
              id="expiration-date"
              placeholder="Expiration Date (MM/YYYY)"
              pattern="(0[1-9]|1[0-2])\/([0-9]{2}|[0-9]{4})"
              title="Use MM/YYYY, for example 12/2029."
              required
            />
            <input
              type="text"
              name="cvv"
              id="cvv"
              placeholder="CVV"
              inputmode="numeric"
              pattern="[0-9]{3,4}"
              title="Enter the 3 or 4 digit security code."
              required
            />
          </div>
          <button type="submit">Place Order</button>
        </form>
        <section class="order-summary">
          <p>Order Summary</p>
          <div id="order-summary"></div>
        </section>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
