<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />

  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header id="main-header" class="divider"></header>

  <main class="divider">
    <section class="products checkout">
      <h2>Review & Place your Order</h2>
      <form class="checkout-form" method="post">
        <div class="checkout-form__section">
          <p>Customer Name</p>
          <input type="text" name="first-name" id="first-name" placeholder="First Name" required />
          <input type="text" name="last-name" id="last-name" placeholder="Last Name" required />
        </div>
        <div class="checkout-form__section checkout-form__section--address">
          <p>Address</p>
          <input type="text" name="street-address" id="street-address" placeholder="Street Address" required />
          <input type="text" name="city" id="city" placeholder="City" required />
          <input type="text" name="state" id="state" placeholder="State" required />
          <input type="text" name="zip" id="zip" placeholder="Zip Code" required />
        </div>
        <div class="checkout-form__section checkout-form__section--payment">
          <p>Payment Information</p>
          <input type="text" name="card-number" id="card-number" placeholder="Card Number" required />
          <input type="text" name="expiration-date" id="expiration-date" placeholder="Expiration Date (MM/YY)"
            required />
          <input type="text" name="cvv" id="cvv" placeholder="CVV" required />
        </div>
        <button type="submit">Place Order</button>
      </form>
      <section class="order-summary">
        <p>Order Summary</p>
        <div id="order-summary"></div>
      </section>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
