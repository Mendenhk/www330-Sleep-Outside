<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Product Make and Name</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/product.js" type="module"></script>
</head>

<body>
  <header id="main-header" class="divider"></header>

  <main class="divider">
    <section class="product-detail">
      <h2>Product Details</h2>
      <h3 class="divider">Product</h3>
      <img src="" alt="" id="productImage" />
    </section>
    <section id="product-info">
      <p id="productBrand" class="product-card__price"></p>
      <p id="productName" class="product-card__price"></p>
      <p id="productPrice" class="product-card__price"></p>
      <p id="productColor" class="product__color"></p>
      <p id="productDesc" class="product__description"></p>
      <div class="product-detail__add">
        <button id="addToCart" data-id="productId">Add to Cart</button>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
