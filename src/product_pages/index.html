<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Make and Name</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/customerReviews.css" />
    <script src="../js/product.js" type="module"></script>

  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="product-detail">
        <h2>Brand Name</h2>
        <h3 class="divider">Product</h3>
        <img
          src="/images/noun_Tent_2517.svg"
          alt="Sleep Outside Camping Products"
          id="productImage"
          class="divider"
        />
        <p id="productPrice" class="product-card__price">$000.99</p>
        <p id="productColor" class="product__color">Color</p>
        <p id="productDesc" class="product__description">Description</p>
        <div class="product-detail__add">
          <button id="addToCart" data-id="productId">Add to Cart</button>
          <button id="addToWishlist" data-id="productId">
            ❤️ Add to Wishlist
          </button>
        </div>
      </section>

            <!-- ===== CUSTOMER REVIEWS SECTION ===== -->
      <section id="reviews-section" class="reviews-section divider">
 
        <div class="reviews-header">
          <h2 class="reviews-title">Customer Reviews</h2>
          <div class="reviews-summary" id="reviewsSummary">
            <!-- Filled dynamically -->
          </div>
        </div>
 
        <!-- Existing reviews list -->
        <div class="reviews-list" id="reviewsList">
          <!-- Filled dynamically -->
        </div>
 
        <!-- Write a review form -->
        <div class="review-form-container">
          <h3 class="review-form-title">Write a Review</h3>
          <div class="review-form">
 
            <div class="form-group">
              <label for="reviewerName">Your Name</label>
              <input
                type="text"
                id="reviewerName"
                placeholder="Enter your name"
                maxlength="60"
              />
            </div>
 
            <div class="form-group">
              <label>Rating</label>
              <div class="star-input" id="starInput" role="group" aria-label="Star rating">
                <span class="star-btn" data-value="1" title="1 star">&#9733;</span>
                <span class="star-btn" data-value="2" title="2 stars">&#9733;</span>
                <span class="star-btn" data-value="3" title="3 stars">&#9733;</span>
                <span class="star-btn" data-value="4" title="4 stars">&#9733;</span>
                <span class="star-btn" data-value="5" title="5 stars">&#9733;</span>
              </div>
              <span class="rating-label" id="ratingLabel">Select a rating</span>
            </div>
 
            <div class="form-group">
              <label for="reviewComment">Your Review</label>
              <textarea
                id="reviewComment"
                placeholder="Share your experience with this product..."
                rows="4"
                maxlength="500"
              ></textarea>
              <span class="char-count" id="charCount">0 / 500</span>
            </div>
 
            <button id="submitReview" class="submit-review-btn">Submit Review</button>
            <p class="review-error" id="reviewError"></p>
          </div>
        </div>
 
      </section>
      <!-- ===== END REVIEWS SECTION ===== -->
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
