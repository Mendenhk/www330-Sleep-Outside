<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product-listing.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products">
        <div class="products-header">
          <h2>
            Top Products: <span class="title highlight"></span>
            <button class="name-sort-button" id="sort-by-name">
              sort by name
            </button>
          </h2>
          <button id="sort-btn" class="sort-button">
            <span class="sort-icon">⇅</span>
            Sort by Price
          </button>
        </div>
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
